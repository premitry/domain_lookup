name = "domain-lookup-bot"
main = "worker.js"
compatibility_date = "2026-05-09"

# Broadcast dikirim bertahap dari Durable Object (pakai alarm, bukan cron):
# kuota Cron Trigger akun free udah kepakai worker lain (maks 5/akun), dan tiap
# alarm dapet budget subrequest sendiri (batas 50/invocation).
[[durable_objects.bindings]]
name = "BC_DO"
class_name = "BcQueue"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["BcQueue"]

# Buat KV dulu:
# wrangler kv namespace create BOT_KV
# Lalu isi id hasilnya di bawah ini.
[[kv_namespaces]]
binding = "BOT_KV"
id = "ee96ca4bbe7c4760953d95fdf98317ff"

[vars]
# Opsional: admin awal, pisahkan dengan koma. Bisa kosong lalu pakai /setadmin.
ADMIN_IDS = ""
BACKUP_TO_MAIN_ADMIN = "true"
